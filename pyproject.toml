[project]
name = "exiffi-ind"
version = "0.1.0"
description = "ExIFFI Industrial Application project. Apply the ExIFFI AD XAI method to some industrial datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
    "exiffi-core",
    "fs>=2.4.16",
    "imageio>=2.37.3",
    "ipdb>=0.13.13",
    "llvmlite>=0.39",
    "mat73>=0.65",
    "numba>=0.56",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyod>=2.0.7",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "setproctitle>=1.3.7",
    "shap>=0.49.1",
    "sklearn-compat>=0.1.5",
    "statwolfacme>=2.1.8",
    "tabulate>=0.9.0",
    "tensorflow>=2.21.0",
    "tensorflow-probability==0.5.0",
    "torch>=2.10.0",
    "tqdm>=4.67.1",
]

[tool.uv.workspace]
members = [
    "ExIFFI_Core",
]

[tool.uv.sources]
exiffi-core = { workspace = true, editable = true }
